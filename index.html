<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Something For You 💚</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#00ff9c;
    --green2:#00c878;
    --blue:#00aaff;
    --blue2:#0066ff;
    --dark:#020b12;
    --dark2:#04151d;
    --white:#eafff7;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,255,156,.15),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(0,170,255,.15),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #020b12,
            #03151d,
            #020b12
        );
}


/* =========================
   SCREENS
========================= */

.screen{
    position:absolute;

    width:100%;
    height:100%;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    overflow:hidden;
}

.screen.active{
    display:flex;
}

.content{
    width:min(850px,94%);
    position:relative;
    z-index:5;
}


/* =========================
   TEXT
========================= */

.small{
    font-size:13px;
    letter-spacing:3px;
    opacity:.65;
    text-transform:uppercase;
}

h1{
    font-size:
        clamp(50px,12vw,110px);

    color:var(--white);

    letter-spacing:4px;

    text-shadow:
        0 0 10px var(--green),
        0 0 30px rgba(0,255,156,.5),
        0 0 60px rgba(0,170,255,.3);
}

h2{
    font-size:
        clamp(30px,7vw,60px);

    margin-bottom:20px;

    color:var(--white);

    text-shadow:
        0 0 15px var(--blue);
}

p{
    font-size:18px;
    line-height:1.8;
    max-width:650px;
    margin:auto;
    color:#d9fff1;
}


/* =========================
   GLOW LINE
========================= */

.line{
    width:120px;
    height:3px;

    margin:20px auto;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            var(--green),
            var(--blue)
        );

    box-shadow:
        0 0 10px var(--green),
        0 0 20px var(--blue);
}


/* =========================
   BUTTON
========================= */

.btn{
    margin-top:30px;

    padding:15px 30px;

    border:1px solid
        rgba(0,255,156,.6);

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(0,255,156,.15),
            rgba(0,170,255,.2)
        );

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 15px
        rgba(0,255,156,.2);

    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px) scale(1.04);

    box-shadow:
        0 0 20px var(--green),
        0 0 40px rgba(0,170,255,.4);
}


/* =========================
   INTRO HEART
========================= */

.bigHeart{
    font-size:90px;

    margin-bottom:15px;

    color:var(--green);

    filter:
        drop-shadow(
            0 0 15px var(--green)
        );

    animation:
        heartBeat 1.5s infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}


/* =========================
   TYPING
========================= */

.typing{
    min-height:150px;

    text-align:left;

    white-space:pre-line;

    line-height:2;

    font-size:18px;

    color:#e5fff5;

    padding:25px;

    border-left:
        3px solid var(--green);

    background:
        linear-gradient(
            90deg,
            rgba(0,255,156,.08),
            transparent
        );

    box-shadow:
        -10px 0 30px
        rgba(0,255,156,.05);
}


/* =========================
   CARDS
========================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-top:30px;
}

.card{
    min-height:130px;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:20px;

    border-radius:18px;

    border:
        1px solid
        rgba(0,255,156,.2);

    background:
        rgba(255,255,255,.035);

    backdrop-filter:blur(10px);

    color:#dffff2;

    cursor:pointer;

    transition:.35s;
}

.card:hover{
    transform:
        translateY(-8px)
        scale(1.03);

    border-color:
        var(--green);

    box-shadow:
        0 0 20px
        rgba(0,255,156,.2);
}

.card span{
    display:block;
}


/* =========================
   SECRET MESSAGE
========================= */

.secret{
    margin-top:25px;

    min-height:30px;

    color:var(--green);

    font-weight:bold;

    text-shadow:
        0 0 10px var(--green);
}


/* =========================
   FINAL
========================= */

.finalTitle{
    font-size:
        clamp(38px,9vw,85px)
